<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moudre du grain clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2d2a;--mute:#5d7069;--panel:#eef4f1;--card:#ffffff;--line:#c9d9d3;--gold:#e5a21b;--gold2:#b97a05;--teal:#2f7f73;--sky1:#a9dcf2;--sky2:#fff2c9;--h1:#a6d57c;--h2:#7fba5e;--grass:#69a84c;--hud:rgba(255,255,255,.82);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e9f1ee;--mute:#9db3ab;--panel:#1b2826;--card:#25362f;--line:#35504a;--sky1:#1d2446;--sky2:#5a4766;--h1:#41664a;--h2:#325240;--grass:#2b4a35;--hud:rgba(27,40,38,.82)}}
:root[data-theme="dark"]{--ink:#e9f1ee;--mute:#9db3ab;--panel:#1b2826;--card:#25362f;--line:#35504a;--sky1:#1d2446;--sky2:#5a4766;--h1:#41664a;--h2:#325240;--grass:#2b4a35;--hud:rgba(27,40,38,.82)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;font-family:Fredoka,system-ui,sans-serif;color:var(--ink);background:var(--panel);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.app{display:grid;grid-template-columns:1fr 390px;height:100%}
#stage{position:relative;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 70%);cursor:pointer;outline:none}
#stage:focus-visible{box-shadow:inset 0 0 0 4px var(--gold)}
.sun{position:absolute;right:12%;top:9%;width:74px;height:74px;border-radius:50%;background:#ffd55a;box-shadow:0 0 0 14px rgba(255,213,90,.28),0 0 0 32px rgba(255,213,90,.14)}
.cloud{position:absolute;height:26px;border-radius:30px;background:#fff;opacity:.85;animation:drift 70s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:34px;height:34px;left:14px;top:-16px}.cloud::after{width:24px;height:24px;left:44px;top:-10px}
.c1{width:90px;top:20%;left:-120px}.c2{width:70px;top:34%;left:-120px;animation-delay:-35s;animation-duration:95s}
@keyframes drift{to{transform:translateX(calc(100vw + 260px))}}
.hill{position:absolute;border-radius:50%}
.hl1{width:90%;height:50%;left:-25%;bottom:6%;background:var(--h1)}
.hl2{width:100%;height:46%;right:-30%;bottom:2%;background:var(--h2)}
.floor{position:absolute;left:0;right:0;bottom:0;height:15%;background:var(--grass);border-top:5px solid rgba(0,0,0,.08)}
#wm{position:absolute;left:5%;bottom:22%;width:92px;height:auto}
#blades{transform-box:fill-box;transform-origin:center;animation:spin var(--spin,14s) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hud{position:absolute;left:16px;top:14px;padding:10px 18px 12px;border-radius:22px;background:var(--hud);backdrop-filter:blur(6px);pointer-events:none;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.hud b{display:block;font-size:clamp(30px,5vw,50px);line-height:1.05;font-weight:700}
.hud span{font-size:14px;color:var(--mute);font-weight:500}
#scene{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);height:min(72%,480px);aspect-ratio:400/340;overflow:visible;pointer-events:none}
#scene *{stroke-linejoin:round;stroke-linecap:round}
#scene .o{stroke:#4a3220;stroke-width:3.5}
#char{transform-box:view-box;transform-origin:160px 320px;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.014)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#arm{transform-box:view-box;transform-origin:200px 180px;transform:rotate(-50deg);animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-50deg)}50%{transform:rotate(-57deg)}}
#pile{transform-box:view-box;transform-origin:288px 282px}
.hit #arm{animation:swing .3s cubic-bezier(.35,.1,.3,1)}
.hit #pile{animation:squash .17s .14s}
.hit #head{animation:bob .3s}
.hit .eye{animation:none;transform:scaleY(.25)}
@keyframes swing{0%{transform:rotate(-50deg)}32%{transform:rotate(-90deg)}58%{transform:rotate(var(--ha,38deg))}76%{transform:rotate(calc(var(--ha,38deg) - 7deg))}100%{transform:rotate(-50deg)}}
@keyframes squash{50%{transform:scale(1.08,.88)}}
@keyframes bob{40%{transform:translate(4px,5px) rotate(2deg)}}
.tl{display:none}
.fl,.p{position:absolute;pointer-events:none;z-index:5}
.fl{font-weight:700;font-size:26px;color:#fff;-webkit-text-stroke:5px #4a3220;paint-order:stroke fill;white-space:nowrap}
.fl.crit{font-size:40px;color:#ffd24a}
.p.g{width:9px;height:6px;border-radius:50%;background:#f2c24e;border:1.5px solid #8a5d12}
.p.f{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(5px)}
#crew{position:absolute;left:0;right:0;bottom:2.2%;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 8px;pointer-events:none;padding:0 12px}
.cr{font-size:28px;display:inline-block;animation:hop 1.2s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.cr em{font-size:14px;font-style:normal;font-weight:700;background:var(--hud);border-radius:10px;padding:1px 7px;margin-left:2px;vertical-align:middle}
@keyframes hop{50%{transform:translateY(-7px)}}
#bg{position:absolute;inset:0;pointer-events:none;z-index:0}
.mw,.bw{position:absolute;transform-origin:bottom center}
.mw{width:60px;height:auto}
.mw .a{transform-box:view-box;transform-origin:32px 34px;animation:mhit .7s ease-in infinite;animation-delay:var(--d)}
.mw .pl{transform-box:fill-box;transform-origin:bottom;animation:msq .7s infinite;animation-delay:var(--d)}
@keyframes mhit{0%,100%{transform:rotate(-55deg)}55%{transform:rotate(32deg)}70%{transform:rotate(24deg)}}
@keyframes msq{0%,50%,100%{transform:scale(1)}58%{transform:scale(1.12,.82)}}
.bw{font-size:34px;line-height:1;animation:bwk 1.1s ease-in-out infinite;animation-delay:var(--d);filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
@keyframes bwk{50%{transform:translateY(-8px) rotate(5deg)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:50;padding:16px}
#modal.on{display:grid}
.box{position:relative;background:var(--panel);color:var(--ink);border-radius:24px;border:3px solid var(--line);padding:20px;width:min(460px,100%);max-height:86vh;overflow:auto;animation:mpop .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes mpop{from{transform:scale(.8);opacity:0}}
.x{position:absolute;right:12px;top:10px;border:0;background:var(--card);border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--ink)}
.box h2{margin:0 34px 4px 0;font-size:22px}.box h4{margin:14px 0 6px;font-size:16px}
.mu{color:var(--mute);font-size:13px;margin:0}
.pr{display:grid;grid-template-columns:28px 1fr auto 60px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}
.pr b{font-weight:500}.pr em{font-style:normal;font-weight:700;color:var(--teal)}.pr small{color:var(--mute);text-align:right}
.btn{display:block;width:100%;margin-top:14px;font:700 16px Fredoka,system-ui,sans-serif;padding:12px;border-radius:16px;border:0;background:var(--gold);color:#3a2600;cursor:pointer;box-shadow:0 4px 0 var(--gold2)}
.btn:active{transform:translateY(3px);box-shadow:none}
.rv{text-align:center;min-height:240px;display:grid;place-items:center;padding-top:16px}
.bx{font-size:96px;animation:shake .95s}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg) scale(1.05)}30%{transform:rotate(14deg) scale(1.1)}45%{transform:rotate(-18deg) scale(1.15)}60%{transform:rotate(18deg) scale(1.2)}80%{transform:rotate(-8deg) scale(1.3)}}
.it{animation:rvl .6s cubic-bezier(.2,1.5,.4,1);border:4px solid var(--rc);border-radius:24px;padding:20px 28px;background:var(--card);box-shadow:0 0 36px var(--rc)}
@keyframes rvl{from{transform:scale(.3) rotate(-10deg);opacity:0}}
.it .big{font-size:76px;line-height:1.1}.it b{display:block;font-size:22px}.it .rar{color:var(--rc);font-weight:700}
.pv{font:600 12px Fredoka,system-ui,sans-serif;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:2px 8px;margin-top:3px;cursor:pointer}
.bar{height:14px;border-radius:9px;background:var(--card);border:2px solid var(--line);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.rbx{padding:4px 4px 10px}.rbx h3{margin:4px 0}.rbx p{margin:2px 0}
.eq{border-color:var(--gold)!important}
.opt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 2px 8px;font-size:13px;color:var(--mute)}
.opt label{display:flex;align-items:center;gap:3px;font-weight:600;cursor:pointer}
.qb,.sb{font:600 13px Fredoka,system-ui,sans-serif;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:3px 10px;cursor:pointer}
.qb.on{background:var(--teal);border-color:var(--teal);color:#fff}
.sb{background:transparent}
.meme{position:absolute;z-index:7;text-align:center;cursor:pointer;animation:wob .5s ease-in-out infinite alternate}
.meme span{display:block;font-size:58px;line-height:1}
.meme small{display:block;background:var(--hud);color:var(--ink);border-radius:12px;padding:2px 10px;font-weight:600;font-size:13px;white-space:nowrap}
@keyframes wob{to{transform:translateY(-10px) rotate(6deg)}}
.ub{display:block;margin:4px 0 0 auto;font:600 12px Fredoka,system-ui,sans-serif;border:2px solid var(--gold);background:var(--card);color:var(--ink);border-radius:10px;padding:2px 8px;cursor:pointer}
.sk{display:flex;align-items:center;gap:4px;font-weight:600;color:var(--ink)}
input[type=color]{width:34px;height:28px;border:0;padding:0;background:none;cursor:pointer}
.box input:not([type=checkbox]):not([type=range]):not([type=color]),.box select,.sk select{padding:5px 8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;max-width:100%}
#evfx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s;background:linear-gradient(105deg,transparent 0 46%,var(--evc,#7be34a) 47% 50%,transparent 51%) 0 0/26px 60px;animation:rain .45s linear infinite}
#evfx.on{opacity:.55}
@keyframes rain{to{background-position:-12px 60px}}
#evb{position:absolute;left:16px;top:96px;display:none;background:var(--ink);color:var(--panel);border-radius:30px;padding:6px 16px;font-weight:600;font-size:14px;white-space:nowrap;z-index:6;pointer-events:none}
#toast{position:absolute;left:50%;top:92px;transform:translate(-50%,-20px);background:var(--ink);color:var(--panel);padding:9px 18px;border-radius:30px;font-weight:600;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.3,1.4,.5,1);z-index:9;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:4px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 12px 8px}
.tab{font:600 14px Fredoka,system-ui,sans-serif;padding:10px 4px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;position:relative;transition:transform .15s}
.tab:active{transform:scale(.95)}
.tab.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tab.ping::after{content:"";position:absolute;top:-4px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
#list{flex:1;min-height:0;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:9px}
.card{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;text-align:left;font:inherit;color:inherit;padding:10px 12px;border-radius:20px;background:var(--card);border:2px solid var(--line);cursor:default;opacity:.62;transition:transform .15s,opacity .2s,border-color .2s}
.card.can{opacity:1;border-color:var(--gold);cursor:pointer;box-shadow:0 4px 0 var(--gold)}
.card.can:hover{transform:translateY(-2px)}
.card.can:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold)}
.card.own{opacity:1;border-color:var(--teal)}
.card:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.ico{font-size:30px;width:50px;height:50px;display:grid;place-items:center;border-radius:16px;background:var(--panel)}
.txt b{display:block;font-size:16px;font-weight:600}
.txt small{color:var(--mute);font-size:13px;line-height:1.25;display:block}
.cost{font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.cost i{display:block;font-style:normal;color:var(--teal);font-size:18px}
.pop{animation:cpop .5s}
@keyframes cpop{40%{transform:scale(1.06)}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:3px solid var(--line);font-size:13px;color:var(--mute)}
.foot button{font:600 12px Fredoka,system-ui,sans-serif;border:2px solid var(--line);background:var(--card);color:var(--mute);border-radius:12px;padding:5px 10px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:24px 10px}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:44% 1fr}aside{border-left:0;border-top:4px solid var(--line)}.hud{padding:6px 14px 8px}.sun{width:48px;height:48px}#wm{width:60px}.cr{font-size:20px}#toast{top:120px}#evb{top:76px}}
@media(prefers-reduced-motion:reduce){.cloud,#blades,.cr{animation:none}}
</style>
</head>
<body>

<main id="stage" tabindex="0" aria-label="Zone de jeu : clique pour moudre du grain">
<div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
<div class="hill hl1"></div><div class="hill hl2"></div>
<svg id="wm" viewBox="0 0 100 130" aria-hidden="true">
<path d="M30 124 L38 52 H62 L70 124Z" fill="#f4ead2" stroke="#4a3220" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M34 52 Q50 30 66 52Z" fill="#8a5a3a" stroke="#4a3220" stroke-width="3.5" stroke-linejoin="round"/>
<rect x="43" y="98" width="14" height="26" rx="7" fill="#8a5a3a" stroke="#4a3220" stroke-width="3"/>
<g id="blades" transform="translate(0,0)"><g stroke="#4a3220" stroke-width="3" stroke-linejoin="round" fill="#fffaf0"><rect x="47" y="4" width="10" height="34" rx="3" transform="translate(-2,10)"/><rect x="47" y="4" width="10" height="34" rx="3" transform="rotate(90 50 48) translate(-2,10)"/><rect x="47" y="4" width="10" height="34" rx="3" transform="rotate(180 50 48) translate(-2,10)"/><rect x="47" y="4" width="10" height="34" rx="3" transform="rotate(270 50 48) translate(-2,10)"/></g><circle cx="50" cy="48" r="7" fill="#8a5a3a" stroke="#4a3220" stroke-width="3"/></g>
</svg>

<svg id="scene" viewBox="0 0 400 340" aria-hidden="true">
<ellipse cx="230" cy="328" rx="190" ry="10" fill="#000" opacity=".16"/>
<g id="char">
<rect class="o" x="125" y="268" width="26" height="46" rx="13" fill="#5b6f8a"/><rect class="o" x="171" y="268" width="26" height="46" rx="13" fill="#5b6f8a"/>
<ellipse class="o" cx="134" cy="316" rx="22" ry="10" fill="#7a4e2c"/><ellipse class="o" cx="186" cy="316" rx="22" ry="10" fill="#7a4e2c"/>
<rect class="o" x="110" y="148" width="100" height="136" rx="42" fill="#3f9c8f"/>
<rect class="o" x="128" y="190" width="64" height="94" rx="24" fill="#f3efe4"/><defs><pattern id="ptn" patternUnits="userSpaceOnUse" x="110" y="148" width="100" height="136"><image id="ptnImg" width="100" height="136" preserveAspectRatio="none"/></pattern></defs><rect id="paintR" x="110" y="148" width="100" height="136" rx="42" fill="none"/>
<path d="M136 205 H184" stroke="#4a3220" stroke-width="3" opacity=".25"/>
<path class="o" d="M124 180 Q104 205 108 232" fill="none" stroke-width="26" style="stroke:#3f9c8f"/>
<path d="M124 180 Q104 205 108 232" fill="none" stroke="#4a3220" stroke-width="3" opacity="0"/>
<circle class="o" cx="108" cy="236" r="12" fill="#f5bf93"/>
<g id="head">
<circle class="o" cx="161" cy="112" r="47" fill="#f5bf93"/>
<ellipse cx="136" cy="128" rx="9" ry="6" fill="#f08a7e" opacity=".55"/><ellipse cx="187" cy="128" rx="9" ry="6" fill="#f08a7e" opacity=".55"/>
<ellipse class="eye" cx="144" cy="113" rx="5.5" ry="7" fill="#3a2616"/><ellipse class="eye" cx="179" cy="113" rx="5.5" ry="7" fill="#3a2616"/>
<circle cx="146" cy="110" r="2" fill="#fff"/><circle cx="181" cy="110" r="2" fill="#fff"/>
<path d="M150 132 Q162 144 174 132" fill="none" stroke="#4a3220" stroke-width="3.5"/>
<path class="o" d="M113 98 Q108 48 162 48 Q216 48 209 98 Q162 84 113 98Z" fill="#f7f1e0"/>
<circle class="o" cx="162" cy="46" r="11" fill="#f7f1e0"/>
<path d="M120 90 Q162 78 202 90" fill="none" stroke="#4a3220" stroke-width="2.5" opacity=".3"/>
</g>
</g>
<rect class="o" x="205" y="272" width="168" height="58" rx="20" fill="#b07a45"/>
<path d="M220 286 H358 M220 304 H358" stroke="#4a3220" stroke-width="3" opacity=".22"/>
<g id="pile">
<path class="o" d="M222 276 Q238 226 276 220 Q316 224 356 276Z" fill="#f2c24e"/>
<g fill="#d49a22" opacity=".85"><ellipse cx="258" cy="252" rx="5" ry="3" transform="rotate(-25 258 252)"/><ellipse cx="290" cy="240" rx="5" ry="3" transform="rotate(20 290 240)"/><ellipse cx="316" cy="262" rx="5" ry="3" transform="rotate(-15 316 262)"/><ellipse cx="272" cy="266" rx="5" ry="3"/><ellipse cx="336" cy="270" rx="5" ry="3" transform="rotate(30 336 270)"/></g>
<path d="M246 244 Q262 228 282 228" fill="none" stroke="#fff" stroke-width="4" opacity=".5"/>
</g>
<g id="arm">
<g id="t1" class="tl"><rect class="o" x="250" y="171" width="78" height="18" rx="9" fill="#b98350"/><circle class="o" cx="334" cy="180" r="16" fill="#c9915a"/></g>
<g id="t2" class="tl"><rect class="o" x="250" y="174" width="66" height="12" rx="6" fill="#a8744a"/><rect class="o" x="300" y="148" width="46" height="64" rx="18" fill="#a3a9b0"/><path d="M312 160 V184" stroke="#fff" stroke-width="5" opacity=".5"/></g>
<g id="t3" class="tl"><rect class="o" x="250" y="174" width="76" height="12" rx="6" fill="#8a5a3a"/><rect class="o" x="298" y="140" width="58" height="80" rx="16" fill="#5d6b7c"/><rect x="298" y="168" width="58" height="10" fill="#8fa0b3" opacity=".7"/><path d="M310 152 V200" stroke="#fff" stroke-width="5" opacity=".35"/></g>
<g id="t4" class="tl"><rect class="o" x="250" y="170" width="86" height="20" rx="10" fill="#f6c945"/><circle class="o" cx="342" cy="180" r="21" fill="#ffd95c"/><path d="M332 170 Q336 164 344 166" fill="none" stroke="#fff" stroke-width="4"/><path d="M262 176 H320" stroke="#fff" stroke-width="3" opacity=".6"/></g>
<path class="o" d="M200 180 H244" fill="none" stroke-width="28" style="stroke:#3f9c8f"/>

</svg>
<div id="crew"></div><div id="evfx"></div><div id="evb"></div>

</main>

<aside>
<div class="tabs" role="tablist">
<button class="tab on" data-tab="tools" role="tab">Outils</button>
<button class="tab" data-tab="work" role="tab">Équipe</button>
<button class="tab" data-tab="up" role="tab">Améliorations</button>
<button class="tab" data-tab="shop" role="tab">Boutique</button>
<button class="tab" data-tab="inv" role="tab">Inventaire</button>
<button class="tab" data-tab="rb" role="tab">Rebirth</button>
<button class="tab" data-tab="wd" role="tab">Mondes</button>
<button class="tab" data-tab="sk" role="tab">Skin</button>

<div class="foot"><span id="stats"></span><button id="reset">Recommencer</button></div>
</aside>
</div>

<script>
const $=s=>document.querySelector(s);
const SP='sepia(1) saturate(';

function faClick(i){if(i===0){if(S.fa||S.g<2e11){toast('Pas assez de grains');return}S.g-=2e11;S.fa=1;toast('Usine achetée !')}else{if(S.g<flCost()){toast('Pas assez de grains');return}S.g-=flCost();S.fl++;toast(`Usine niveau ${S.fl} !`)}render()}
function fmBuy(i){if(!S.fa||S.g<fmCost(i)){toast('Pas assez de grains');return}S.g-=fmCost(i);S.fm[i]=(S.fm[i]||0)+1;toast(`${FM[i].n} installée !`);render()}
const PT={skin:'#f5bf93',shirt:'#3f9c8f',apron:'#f3efe4',pants:'#5b6f8a',hat:'#f7f1e0'};
function tagSkin(){const s=$('#scene');for(const p in PT)s.querySelectorAll(`[fill="${PT[p]}"],[style*="stroke:${PT[p]}"]`).forEach(e=>e.dataset.p=p);$('#head').insertAdjacentHTML('beforeend','<g id="hx"></g>')}
function applySkin(){const k=S.sk;
  document.querySelectorAll('#scene [data-p]').forEach(e=>{const p=e.dataset.p;if(e.style.stroke)e.style.stroke=k[p];else e.setAttribute('fill',k[p]);e.style.display=(p==='hat'&&k.hs!=='chef')||(p==='apron'&&!k.ap)?'none':''});
  const a=+k.age,hc=a>=65?'#ececec':a>=45?'#9a9a9a':k.hair;let s='';
  if(k.hs==='none')s+=`<path class="o" d="M114 92Q108 50 162 48Q216 50 210 92Q196 68 162 66Q128 68 114 92Z" fill="${hc}"/>`;
  if(a<13)s+=`<circle class="o" cx="112" cy="108" r="12" fill="${hc}"/><circle class="o" cx="212" cy="108" r="12" fill="${hc}"/>`;
  if(k.hs==='cap')s+=`<path class="o" d="M114 96Q112 54 162 54Q212 54 210 96Q162 86 114 96Z" fill="${k.hat}"/><path class="o" d="M150 92Q200 84 226 98Q190 106 150 100Z" fill="${k.hat}"/>`;
  if(k.hs==='straw')s+=`<ellipse class="o" cx="162" cy="88" rx="72" ry="13" fill="#e8c46a"/><path class="o" d="M118 86Q118 46 162 46Q206 46 206 86Z" fill="${k.hat}"/>`;
  if(a>=40||k.bd)s+=`<path class="o" d="M144 128Q162 118 180 128Q162 136 144 128Z" fill="${hc}"/>`;
  if(k.bd)s+=`<path class="o" d="M122 126Q162 190 202 126Q182 152 162 152Q142 152 122 126Z" fill="${hc}"/>`;
  if(a>=55)s+=`<path d="M136 124q4 4 0 9M188 124q-4 4 0 9M138 78q24-6 48 0" fill="none" stroke="#4a3220" stroke-width="2" opacity=".45"/>`;
  if(k.gl)s+=`<g fill="none" stroke="#4a3220" stroke-width="3"><circle cx="144" cy="113" r="12"/><circle cx="179" cy="113" r="12"/><path d="M156 113H167"/></g>`;
  $('#hx').innerHTML=s;
  const pr=$('#paintR');if(k.paint){$('#ptnImg').setAttribute('href',k.paint);pr.setAttribute('fill','url(#ptn)')}else pr.setAttribute('fill','none')}
function skHTML(){const k=S.sk,col=(n,l)=>`<label class="sk">${l}<input type="color" data-sk="${n}" value="${k[n]}"></label>`;
  return `<div class="opt"><label class="sk" style="flex:1 1 100%">Âge : <b>${k.age}</b> ans <input type="range" min="5" max="95" data-sk="age" value="${k.age}" style="flex:1"></label>${col('skin','Peau')}${col('hair','Cheveux')}${col('shirt','Haut')}${col('apron','Tablier')}${col('pants','Pantalon')}${col('hat','Chapeau')}</div><div class="opt"><label class="sk">Chapeau <select data-sk="hs">${[['chef','Toque'],['cap','Casquette'],['straw','Paille'],['none','Aucun']].map(a=>`<option value="${a[0]}"${k.hs===a[0]?' selected':''}>${a[1]}</option>`).join('')}</select></label><label class="sk"><input type="checkbox" data-sk="ap"${k.ap?' checked':''}> Tablier</label><label class="sk"><input type="checkbox" data-sk="gl"${k.gl?' checked':''}> Lunettes</label><label class="sk"><input type="checkbox" data-sk="bd"${k.bd?' checked':''}> Barbe</label></div><p class="mu" style="margin:8px 2px">Peinture sur le vêtement (comme Paint) :</p><div class="opt"><input type="color" id="pbc" value="#e5a21b"><input type="range" id="pbs" min="2" max="30" value="10"><button class="qb" id="pfill">Remplir</button><button class="qb" id="pclr">Effacer</button></div><canvas id="pcv" width="100" height="136" style="width:200px;height:272px;border:3px dashed var(--line);border-radius:20px;touch-action:none;cursor:crosshair"></canvas>`}
function skInit(){const cv=$('#pcv'),x=cv.getContext('2d');let d=false,lp=null;
  const rr=(a,b,w,h,r,c)=>{x.fillStyle=c;x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h);x.fill()};
  const base=()=>{x.clearRect(0,0,100,136);rr(0,0,100,136,42,S.sk.shirt);if(S.sk.ap)rr(18,42,64,94,24,S.sk.apron)};
  if(S.sk.paint){const im=new Image();im.onload=()=>x.drawImage(im,0,0);im.src=S.sk.paint}else base();
  const dr=e=>{const r=cv.getBoundingClientRect(),a=(e.clientX-r.left)*100/r.width,b=(e.clientY-r.top)*136/r.height;x.strokeStyle=$('#pbc').value;x.lineWidth=+$('#pbs').value/2.5;x.lineCap='round';x.beginPath();x.moveTo(lp?lp[0]:a,lp?lp[1]:b);x.lineTo(a+.01,b);x.stroke();lp=[a,b]};
  const sv=()=>{S.sk.paint=cv.toDataURL();applySkin()};
  cv.onpointerdown=e=>{d=true;lp=null;cv.setPointerCapture(e.pointerId);dr(e)};cv.onpointermove=e=>{if(d)dr(e)};cv.onpointerup=()=>{if(d){d=false;lp=null;sv()}};
  $('#pfill').onclick=()=>{x.fillStyle=$('#pbc').value;x.fillRect(0,0,100,136);sv()};$('#pclr').onclick=()=>{base();S.sk.paint='';applySkin()}}
$('#list').addEventListener('input',e=>{const t=e.target,k=t.dataset.sk;if(k===undefined)return;S.sk[k]=t.type==='checkbox'?(t.checked?1:0):t.type==='range'?+t.value:t.value;if(t.type==='range'){const b=t.closest('label').querySelector('b');if(b)b.textContent=t.value}applySkin()});
function admin(){modal(`<h2>🛠️ Panneau admin</h2><div class="opt"><input id="adg" value="1e30" style="flex:1"><button class="qb" data-a="g">Donner des grains</button></div><div class="opt"><input id="adc" value="999" size="4" title="N° de caisse (0-999)"><select id="adr">${RN.map((n,r)=>`<option value="${r}">${n}</option>`).join('')}</select><input id="adj" value="0" size="2" title="N° d’objet (0-9)"><button class="qb" data-a="item">Donner l’objet</button></div><div class="opt"><input id="adn" value="100" size="5"><button class="qb" data-a="open">Ouvrir gratuitement N caisses (n° ci-dessus)</button></div><div class="opt"><button class="qb" data-a="tools">Meilleur outil</button><button class="qb" data-a="work">+10 équipiers</button><button class="qb" data-a="ups">+5 niv. améliorations</button><button class="qb" data-a="inv">+10 niv. objets</button><button class="qb" data-a="wd">Tous les portails</button><button class="qb" data-a="fa">Usine + machines</button><button class="qb" data-a="rb">+1 rebirth</button><button class="qb" data-a="all">TOUT débloquer</button></div>`);
  $('.box').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)adm(b.dataset.a)})}
function adm(a){const A={
  g(){const v=Number($('#adg').value)||0;S.g+=v;S.tot+=v},
  item(){const c=Math.max(0,Math.min(999,+$('#adc').value|0)),r=+$('#adr').value,j=Math.max(0,Math.min(9,+$('#adj').value|0)),id=c+'-'+r+'-'+j;S.inv[id]=(S.inv[id]||0)+1;if(!S.eq.includes(id)&&S.eq.length<slots())S.eq.push(id)},
  open(){const c=Math.max(0,Math.min(999,+$('#adc').value|0)),n=Math.max(1,+$('#adn').value|0),q=S.q;S.q=n;S.g+=crCost(c)*n;closeModal();openCrate(c);S.q=q},
  tools(){S.tool=TOOLS.length-1;applyTool()},work(){S.w=S.w.map(n=>n+10);crew()},ups(){UPS.forEach(u=>S.ul[u.id]=(S.ul[u.id]||0)+5)},
  inv(){Object.keys(S.inv).forEach(id=>S.il[id]=(S.il[id]||0)+10)},wd(){WD.forEach((w,i)=>{if(!S.wd.includes(i))S.wd.push(i)})},
  fa(){S.fa=1;FM.forEach((m,i)=>S.fm[i]=(S.fm[i]||0)+10)},rb(){S.rb++},
  all(){A.tools();A.work();A.ups();A.wd();A.fa();S.g+=1e30;S.tot+=1e30;S.cmax=1000;S.inv['999-6-0']=1;if(!S.eq.includes('999-6-0')){if(S.eq.length<slots())S.eq.push('999-6-0');else S.eq[0]='999-6-0'}}};
  A[a]();toast('Admin : fait');ui();render()}
addEventListener('keydown',e=>{if(e.code==='KeyO'&&(e.getModifierState('AltGraph')||(e.ctrlKey&&e.altKey))){e.preventDefault();admin()}});
const shopOpt=()=>`<div class="opt"><b>Ouvrir :</b>${[1,5,10,25,100,0].map(q=>`<button class="qb${S.q===q?' on':''}" data-q="${q}">${q?'×'+q:'Max'}</button>`).join('')}</div><div class="opt"><b>Vendre auto :</b>${RN.map((n,r)=>`<label style="color:${RC[r]}"><input type="checkbox" data-as="${r}"${S.as[r]?' checked':''}> ${n}</label>`).join('')}</div>`;
const sellOpt=()=>`<div class="opt"><b>Vendre tout :</b>${RN.map((n,r)=>`<button class="sb" data-r="${r}" style="border-color:${RC[r]};color:${RC[r]}">${n}</button>`).join('')}</div>`;
let sbp=-1,sbt;
function sellRar(r){let n=0,v=0;const ids=Object.keys(S.inv).filter(id=>item(id).r===r);
  ids.forEach(id=>{const k=S.inv[id]-(S.eq.includes(id)?1:0);if(k>0){n+=k;v+=k*sellVal(item(id))}});
  if(!n){toast('Rien à vendre dans cette rareté');return}
  if(sbp!==r){sbp=r;clearTimeout(sbt);sbt=setTimeout(()=>sbp=-1,3000);toast(`Vendre ${n} objet${n>1?'s':''} (${RN[r].toLowerCase()}) pour ${fmt(v)} grains ? Clique encore`);return}
  sbp=-1;ids.forEach(id=>{if(S.eq.includes(id))S.inv[id]=1;else delete S.inv[id]});S.g+=v;toast(`Vendu : +${fmt(v)} grains`);render()}
function openCrate(c){
  if(busy)return;const cost=crCost(c);const n=Math.min(S.q||1000,Math.floor(S.g/cost));
  if(n<1){toast('Pas assez de grains');return}
  busy=true;S.g-=cost*n;const cnt=[0,0,0,0,0,0,0];let sold=0,best=null;
  for(let k=0;k<n;k++){const o=rollItem(c);cnt[o.r]++;if(!best||o.m>best.m)best=o;
    if(S.as[o.r]){sold+=sellVal(o);continue}
    S.inv[o.id]=(S.inv[o.id]||0)+1;
    if(!S.eq.includes(o.id)){if(S.eq.length<slots())S.eq.push(o.id);else{const wr=S.eq.reduce((a,id)=>item(id).m<item(a).m?id:a,S.eq[0]);if(o.m>item(wr).m)S.eq[S.eq.indexOf(wr)]=o.id}}}
  S.g+=sold;modal('<div class="rv"><div class="bx">'+crIc(c)+'</div></div>');ui();
  setTimeout(()=>{const rv=$('.rv');if(!rv){busy=false;return}
    rv.innerHTML=`<div><div class="it" style="--rc:${RC[best.r]}"><div class="big">${best.i}</div><b>${best.n}</b><span class="rar">${RN[best.r]}</span><p>Gains ×${best.m}</p></div><p class="mu" style="margin-top:12px">${n>1?n+' caisses ouvertes · ':''}${RN.map((x,r)=>cnt[r]?cnt[r]+' '+x.toLowerCase():'').filter(Boolean).join(', ')}${sold?' · vendus : +'+fmt(sold)+' grains':''}</p><button class="btn" id="ag">Rouvrir ${S.q?'×'+S.q:'(max)'}</button></div>`;
    busy=false;$('#ag').onclick=()=>{closeModal();openCrate(c)};if(tab==='inv')render();ui()},n>1?600:1000)}
const MEMES=[{i:'🐶',t:'Much grain. Very mill. Wow.'},{i:'📈',t:'Stonks ! Les grains montent'},{i:'🔥',t:'This is fine…'},{i:'🌈🐱',t:'Nyan nyan nyan !'},{i:'😏',t:'Problème ?'},{i:'🎵',t:'Never gonna give you grain up'},{i:'🐸',t:'C’est mercredi, mes grains'},{i:'😎',t:'Deal with it'},{i:'🤔',t:'Hmm… farine ou pas farine ?'}];
function meme(){if(document.hidden||$('.meme'))return;const m=MEMES[Math.floor(Math.random()*MEMES.length)],e=document.createElement('div');
  e.className='meme';e.innerHTML=`<span>${m.i}</span><small>${m.t}</small>`;e.style.top=(16+Math.random()*30)+'%';e.style.left='-200px';stage.appendChild(e);
  e.animate([{left:'-200px'},{left:stage.clientWidth+'px'}],{duration:9000+Math.random()*3000,easing:'linear'}).onfinish=()=>e.remove();
  e.addEventListener('pointerdown',ev=>{ev.stopPropagation();const v=Math.max(cps()*60,cpc()*50,100);S.g+=v;S.tot+=v;const at={x:e.offsetLeft+40,y:e.offsetTop+30};float('+'+fmt(v)+' 😂',true,at);burst(16,true,at);e.remove();ui()})}
setInterval(()=>{if(Math.random()<.1)meme()},5000);
function save(){S.t=Date.now();S.wk={};WORK.forEach((w,i)=>S.wk[w.k]=S.w[i]||0);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
setInterval(save,5000);addEventListener('beforeunload',save);

let last=performance.now(),acc=0;
setInterval(()=>{
  const n=performance.now(),dt=Math.min((n-last)/1000,3600);last=n;
  const add=cps()*dt;S.g+=add;S.tot+=add;acc+=dt;
  if(acc>=1){acc=0;if(cps()>0)burst(2,false);const sg=sig();if(sg!==lastSig){lastSig=sg;render()}else ui()}else ui();
},100);
const sig=()=>WORK.map((w,i)=>S.w[i]||S.tot>=w.b*.5?1:0).join('')+UPS.map(u=>upVis(u)?1:0).join('')+'|'+shopN();
let lastSig=sig();

tagSkin();applySkin();applyWorld();applyTool();crew();render();
const away=Math.min((Date.now()-S.t)/1000,7200);
if(cps()>0&&away>60){const gain=cps()*away*.5;S.g+=gain;S.tot+=gain;ui();toast(`Pendant ton absence : +${fmt(gain)} grains`)}
</script>
